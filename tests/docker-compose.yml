version: '3.8'

services:
  redis-master:
    image: redis:latest
    container_name: redis-master
    command: redis-server --requirepass mysecretpassword
    ports:
      - "6379:6379"

  redis-replica1:
    image: redis:latest
    command: redis-server --requirepass mysecretpassword --masterauth mysecretpassword --replicaof redis-master 6379
    ports:
      - "6380:6379"
    depends_on:
      - redis-master
  redis-replica2:
    image: redis:latest
    command: redis-server --requirepass mysecretpassword --masterauth mysecretpassword --replicaof redis-master 6379
    ports:
      - "6381:6379"
    depends_on:
      - redis-master
