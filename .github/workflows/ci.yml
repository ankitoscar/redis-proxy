name: Redis Proxy CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Verify code formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "The following files are not formatted correctly:"
          gofmt -l .
          exit 1
        fi

    - name: Build Redis Proxy
      run: go build -v -o redis-proxy main.go

    - name: Run Go Unit Tests
      run: go test -v ./...

    - name: Install redis-cli
      run: |
        sudo apt-get update
        sudo apt-get install -y redis-tools

    - name: Create redis-proxy.conf
      run: |
        cat <<EOF > redis-proxy.conf
        listen_addr = 127.0.0.1:16379
        backend = 127.0.0.1:6379 master
        backend = 127.0.0.1:6380 replica
        backend = 127.0.0.1:6381 replica
        password = mysecretpassword
        load_balance = round-robin
        EOF

    - name: Run Integration Tests
      run: |
        chmod +x tests/test_integration.sh
        ./tests/test_integration.sh

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Build cross-platform binaries
      run: |
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o redis-proxy-linux-amd64 main.go
        GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o redis-proxy-darwin-amd64 main.go

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          redis-proxy-linux-amd64
          redis-proxy-darwin-amd64
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/redis-proxy
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
